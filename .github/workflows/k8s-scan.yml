name: Kubernetes Security Scan

on:
  push:
    paths:
      - '**/*.yaml'
      - '**/*.yml'
      - 'k8s/**'
  pull_request:
    paths:
      - 'k8s/**'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Kubescape on manifests
        run: python scanners/kubernetes/run_kubescape.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Notify bot (comment + Kanban)
        run: python bot/github_bot.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}